[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astravision"
version = "1.0.0"
authors = [
  { name="Sandeep Kumar", email="kumarsandeep82649@gmail.com" },
]
description = "AstraVision: Modern Perceptual Image Quality Assessment & Structural Intelligence Platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
